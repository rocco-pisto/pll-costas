[project]
name = "pll"
version = "0.1.0"
description = "Costas-loop PLL on Cyclone IV: Python models and cocotb testbenches for the VHDL design"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cocotb>=2.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
]

[project.scripts]
pll = "pll:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
